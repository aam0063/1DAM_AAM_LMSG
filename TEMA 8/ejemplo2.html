<!DOCTYPE html>
<html>

<head>
    <title>Propiedades de texto</title>
    <style>
        ul li:first-child{
            color:red
        }
        ul li:last-child{
            color: green
        }
        ul li:nth-child(3){
            color:blue
        }

        ul{
            list-style-type: none;
            background-color: #00FF00;
            word-spacing: 20px;
            padding: 10px;
        }

        li{
            display: inline-block;
        }

        li a{
            color:black;
            text-decoration: none;
        }

        li a:hover{
            background-color: purple;
        }

        li::first-letter{
            text-transform: uppercase;
        }
        a:link{
            color:green
        }

        a:visited {
            color: red
        }
        p::after{
            content: "esto es un parrafo";
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#noticias">noticias</a></li>
        <li><a href="#contacto">contacto</a></li>
        <li><a href="#acerca">acerca</a></li>
    </ul>

    <p><b>PAISES</b></p>
    <ul>
        <li>españa</li>
        <li>portugal</li>
        <li>pakistan</li>
        <li>china</li>
    </ul>

</body>

</html>
