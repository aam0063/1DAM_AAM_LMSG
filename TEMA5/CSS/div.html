<!DOCTYPE html>
<html>
<head>
    <style>
        /* Estilos para los divs */
        .rojo {
            background-color: red;
            color: white;
            padding: 20px;
            margin: 10px 0;
        }

        .azul {
            background-color: blue;
            color: white;
            padding: 20px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="rojo">
        <h2>Div rojo</h2>
        <p>Este es un div con fondo rojo.</p>
    </div>

    <div class="azul">
        <h2>Div azul</h2>
        <p>Este es un div con fondo azul.</p>
    </div>

</body>
</html>
